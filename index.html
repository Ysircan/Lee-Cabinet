  <style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial,sans-serif;color:#29372f;background:#eee}#viewer{position:fixed;inset:0}canvas{display:block;touch-action:none}button,input{font:inherit}button{cursor:pointer}.icon{width:44px;height:44px;border:1px solid #dde3df;border-radius:12px;background:white;color:#34473b;font-size:22px}button:focus-visible,input:focus-visible+.switch{outline:3px solid #678b77;outline-offset:3px}#menu{position:fixed;top:20px;left:20px;z-index:20;box-shadow:0 4px 18px #24392a12}#sidebar{position:fixed;top:20px;bottom:20px;left:20px;width:260px;z-index:30;padding:20px;display:flex;flex-direction:column;background:rgba(255,255,255,.96);border:1px solid #dde3df;border-radius:18px;box-shadow:0 8px 32px #24392a12;transition:transform .24s,visibility .24s}body:not(.open) #sidebar{transform:translateX(calc(-100% - 24px));visibility:hidden}body.open #menu{visibility:hidden}.header{display:flex;align-items:center;justify-content:space-between}h1{font-size:17px;margin:0 0 6px;letter-spacing:-.4px}.version{font-size:11px;color:#89958e;letter-spacing:1px}h2{font-size:10px;letter-spacing:1.8px;color:#89958e;margin:36px 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px;border-bottom:1px solid #edf0ee;font-size:14px}.included{font-size:11px;color:#577966}.toggle{position:relative;display:flex;align-items:center;min-height:44px;width:44px;cursor:pointer}.toggle input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}.switch{width:42px;height:24px;border-radius:20px;background:#dce3de;pointer-events:none;transition:background .2s}.switch:after{content:'';display:block;width:18px;height:18px;margin:3px;border-radius:50%;background:white;box-shadow:0 1px 3px #0002;transition:transform .2s}input:checked+.switch{background:#557b68}input:checked+.switch:after{transform:translateX(18px)}.status{margin-top:auto;padding-top:24px;font-size:13px;line-height:1.7}.label{font-size:11px;color:#89958e}#status{font-size:12px;color:#718077;min-height:21px}#status.error{color:#a34538}.hint{margin-top:18px;padding-top:16px;border-top:1px solid #edf0ee;font-size:11px;color:#89958e;line-height:1.8}#backdrop{display:none}@media(max-width:768px){#sidebar{top:0;bottom:0;left:0;width:min(82vw,320px);border-radius:0 18px 18px 0;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}#backdrop{position:fixed;inset:0;z-index:25;background:#17231d26;border:0;padding:0}body.open #backdrop{display:block}}@media(prefers-reduced-motion:reduce){#sidebar,.switch,.switch:after{transition:none}}
</style>

  <style>
    #sidebar { overflow-y: auto; }
    .header, section, .status, .hint { flex-shrink: 0; }
    .colour-section { margin-top: 26px; border-top: 1px solid #edf0ee; flex-shrink: 0; }
    .colour-section summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; justify-content: space-between; font-size: 10px; font-weight: 600; letter-spacing: 1.8px; color: #718077; list-style: none; }
    .colour-section summary::-webkit-details-marker { display: none; }
    .colour-section summary::after { content: '+'; font-size: 18px; }
    .colour-section[open] summary::after { content: '\2212'; }
    #selection-prompt { font-size: 12px; color: #718077; line-height: 1.6; margin: 4px 0 12px; }
    #selected-name { font-size: 13px; margin: 4px 0; }
    #selected-mesh { font-size: 11px; color: #89958e; margin-bottom: 16px; }

    .swatch { min-height: 52px; padding: 7px; border: 1px solid #e0e5e1; border-radius: 10px; background: white; color: #45564a; display: flex; align-items: center; gap: 7px; font-size: 11px; text-align: left; }
    .swatch span { width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; background: var(--swatch); border: 1px solid #0002; }
    .swatch[aria-pressed="true"] { border-color: #557b68; box-shadow: inset 0 0 0 1px #557b68; }
    .swatch:disabled { opacity: .45; cursor: default; }
    #floating-colour { display: none; }
    @media (max-width: 768px) {
      #sidebar {
        top: max(12px, env(safe-area-inset-top));

        border-radius: 18px;

        box-shadow: 0 6px 24px #24392a18;
        opacity: 0;

        transform: translate(-50%, 8px);
        transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
      }
      #floating-colour.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translate(-50%, 0);
        transition-delay: 0s;
      }
      .palette-label { margin: 0 0 6px 4px; font-size: 10px; letter-spacing: 1.4px; color: #7d857e; }
      #floating-colour #colour-options { display: flex; gap: 4px; overflow-x: auto; }
      #floating-colour .swatch { flex: 1 0 44px; min-width: 44px; min-height: 44px; padding: 6px; justify-content: center; font-size: 0; border-color: transparent; background: transparent; }
      #floating-colour .swatch span { width: 28px; height: 28px; border-radius: 8px; }
      #floating-colour .swatch[aria-pressed="true"] { border-color: #777b74; box-shadow: inset 0 0 0 1px #777b74; }
    }
    @media (prefers-reduced-motion: reduce) {
      #floating-colour { transition: none; }
    }
  </style>

<body>

<div id="viewer"></div>

<button id="menu" class="icon" aria-label="Open scene menu" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
<button id="backdrop" aria-label="Close scene menu" tabindex="-1"></button>
<aside id="sidebar" aria-label="Scene settings" inert>
<div class="header"><div><h1>Cabinet Viewer</h1><span class="version">V0</span></div><button id="close" class="icon" aria-label="Collapse scene menu">&#8249;</button></div>
<section aria-labelledby="scene-heading"><h2 id="scene-heading">SCENE</h2><div class="row"><span>Upper Cabinets</span><span class="included">&#10003; Included</span></div><div class="row"><label for="island">Island</label><label class="toggle"><input id="island" type="checkbox" role="switch" aria-label="Include Island"><span class="switch" aria-hidden="true"></span></label></div></section>
<details class="colour-section" open>
  <summary>COLOUR</summary>

  <div id="selection-info" role="status" aria-live="polite" hidden>

    <button type="button" class="swatch" data-colour="#E9E3D8" style="--swatch:#E9E3D8" aria-pressed="false"><span aria-hidden="true"></span>Warm White</button>

    <button type="button" class="swatch" data-colour="#4A4A47" style="--swatch:#4A4A47" aria-pressed="false"><span aria-hidden="true"></span>Charcoal</button>
    <button type="button" class="swatch" data-colour="#202020" style="--swatch:#202020" aria-pressed="false"><span aria-hidden="true"></span>Black</button>
  </fieldset>
</details>
<!-- A single set of swatches moves here on mobile; selection/material logic is shared. -->
<div class="status" role="status" aria-live="polite"><div class="label">Scene</div><div id="scene-name">Upper Cabinets</div><div id="status">Loading...</div></div><div class="hint">Drag to rotate &middot; Scroll / pinch to zoom<br>Right drag / two fingers to pan &middot; Tap a door to select</div></aside>
<div id="floating-colour" role="group" aria-label="Selected door colour" aria-hidden="true" inert>
  <div class="palette-label">COLOUR</div>
  <div id="floating-colour-slot"></div>
</div>
<script>
const mobile=matchMedia('(max-width: 768px)');
const panel=document.getElementById('sidebar'),menu=document.getElementById('menu'),close=document.getElementById('close');
function setOpen(open,focus=false){document.body.classList.toggle('open',open);panel.inert=!open;menu.setAttribute('aria-expanded',String(open));if(focus)(open?close:menu).focus();document.dispatchEvent(new Event('scene-menu-change'))}
setOpen(!mobile.matches);menu.onclick=()=>setOpen(true,true);close.onclick=()=>setOpen(false,true);document.getElementById('backdrop').onclick=()=>setOpen(false,true);mobile.addEventListener('change',()=>setOpen(!mobile.matches));
document.addEventListener('keydown',event=>{
  if(!document.body.classList.contains('open'))return;
  if(event.key==='Escape')setOpen(false,true);
  if(mobile.matches&&event.key==='Tab'){
    const items=[...panel.querySelectorAll('button,input,summary')].filter(item=>!item.matches(':disabled')&&item.getClientRects().length);
    const first=items[0],last=items[items.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
  }
});
</script>

<script type="module">

import * as THREE from 'three';

import { OrbitControls }
from 'three/addons/controls/OrbitControls.js';

import { GLTFLoader }
from 'three/addons/loaders/GLTFLoader.js';


// ======================================================
// SCENE
// ======================================================

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0xe7e7e5);


// ======================================================
// CAMERA
// ======================================================

const camera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    100
  );

camera.position.set(
  4,
  -5,
  3
);


// ======================================================
// RENDERER
// ======================================================

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document
  .getElementById("viewer")
  .appendChild(renderer.domElement);


// ======================================================
// LIGHTING
// ======================================================

const hemisphere =
  new THREE.HemisphereLight(
    0xffffff,
    0x858580,
    0.8
  );

scene.add(hemisphere);


const keyLight =
  new THREE.DirectionalLight(
    0xffffff,
    2.2
  );

// GLB uses Y-up, with door fronts facing +Z.
keyLight.position.set(-3, 5, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.00001;

scene.add(keyLight);
scene.add(keyLight.target);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
fillLight.position.set(4, 2, 1);
scene.add(fillLight, fillLight.target);

function configureLighting(box) {
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(box.getBoundingSphere(new THREE.Sphere()).radius, 0.001);
  keyLight.target.position.copy(center);
  keyLight.position.copy(center).addScaledVector(new THREE.Vector3(-3, 5, 4).normalize(), radius * 3);
  fillLight.target.position.copy(center);
  fillLight.position.copy(center).addScaledVector(new THREE.Vector3(4, 2, 1).normalize(), radius * 3);

  // Fit the shadow camera to the actual scene rather than a large default volume.
  // Small bias preserves millimetre gaps instead of detaching contact shadows.
  keyLight.updateMatrixWorld(true);
  keyLight.target.updateMatrixWorld(true);
  const shadowCamera = keyLight.shadow.camera;
  shadowCamera.position.copy(keyLight.position);
  shadowCamera.lookAt(center);
  shadowCamera.updateMatrixWorld(true);
  const lightBounds = new THREE.Box3();
  for (const x of [box.min.x, box.max.x]) {
    for (const y of [box.min.y, box.max.y]) {
      for (const z of [box.min.z, box.max.z]) {
        lightBounds.expandByPoint(new THREE.Vector3(x, y, z).applyMatrix4(shadowCamera.matrixWorldInverse));
      }
    }
  }
  const padding = radius * 0.05;
  shadowCamera.left = lightBounds.min.x - padding;
  shadowCamera.right = lightBounds.max.x + padding;
  shadowCamera.bottom = lightBounds.min.y - padding;
  shadowCamera.top = lightBounds.max.y + padding;
  shadowCamera.near = Math.max(0.001, -lightBounds.max.z - padding);
  shadowCamera.far = -lightBounds.min.z + padding;
  shadowCamera.updateProjectionMatrix();
  keyLight.shadow.normalBias = radius * 0.00002;
  keyLight.shadow.needsUpdate = true;
}

function prepareModelRendering(model) {
  // Collect first: adding children during traversal should not affect iteration.
  const meshes = [];
  model.traverse(object => { if (object.isMesh) meshes.push(object); });
  for (const mesh of meshes) {
    if (isSelectableDoor(mesh)) {
      // Clone PBR materials, retaining maps, roughness and metalness.
      mesh.material = Array.isArray(mesh.material)
        ? mesh.material.map(material => material.clone()) : mesh.material.clone();
    }
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    const isDoor = /^UC_0[1-7]_Door$/i.test(mesh.name);
    const isCarcass = /^UC_.*Panel$/i.test(mesh.name);
    const edges = new THREE.EdgesGeometry(mesh.geometry, 30);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({
      color: 0x777777,
      transparent: true,
      opacity: isDoor ? 0.30 : isCarcass ? 0.14 : 0.18,
      depthTest: true,
      depthWrite: false,
      toneMapped: false
    }));
    line.name = `${mesh.name}_SubtleEdges`;
    if (isSelectableDoor(mesh)) mesh.userData.selectionEdge = line;
    // Keep edges exactly on their parent; no scaling or position offsets.
    // Depth testing hides rear edges, and disabling picking preserves mesh clicks.
    line.raycast = () => {};
    mesh.add(line);
  }
}


// ======================================================
// CONTROLS
// ======================================================

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;

controls.dampingFactor = 0.06;

controls.enablePan = true;


// ======================================================
// RAYCASTER
// ======================================================

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();

let currentModel = null;
let selectedDoor = null;
const colourOptions = document.getElementById('colour-options');
const swatches = [...colourOptions.querySelectorAll('[data-colour]')];
const editMobile = window.matchMedia('(max-width: 768px)');
const floatingColour = document.getElementById('floating-colour');
const desktopColourSection = document.querySelector('.colour-section');
const floatingColourSlot = document.getElementById('floating-colour-slot');
swatches.forEach(swatch => {
  const label = swatch.textContent.trim();
  swatch.setAttribute('aria-label', label);
  swatch.title = label;
});

function syncColourPresentation() {
  const container = editMobile.matches ? floatingColourSlot : desktopColourSection;
  if (colourOptions.parentElement !== container) container.appendChild(colourOptions);
  const visible = editMobile.matches && !!selectedDoor && !document.body.classList.contains('open');
  floatingColour.classList.toggle('is-visible', visible);
  floatingColour.setAttribute('aria-hidden', String(!visible));
  // Disable interaction immediately while CSS finishes the short fade-out.
  floatingColour.inert = !visible;
}
editMobile.addEventListener('change', syncColourPresentation);
document.addEventListener('scene-menu-change', syncColourPresentation);
syncColourPresentation();

function isSelectableDoor(object) {
  return object?.isMesh && /^UC_0[1-7]_Door$/.test(object.name);
}
function resolveDoor(object) {
  while (object && object !== currentModel) {
    if (isSelectableDoor(object)) return object;
    object = object.parent;
  }
  return null;
}
function updateSelectionUI() {
  colourOptions.disabled = !selectedDoor;
  document.getElementById('selection-prompt').hidden = !!selectedDoor;
  document.getElementById('selection-info').hidden = !selectedDoor;
  document.getElementById('selected-name').textContent = selectedDoor
    ? `Upper Cabinet Door ${selectedDoor.name.match(/UC_(\d+)_Door/)[1]}` : '';
  document.getElementById('selected-mesh').textContent = selectedDoor?.name || '';
  const materials = selectedDoor ? (Array.isArray(selectedDoor.material) ? selectedDoor.material : [selectedDoor.material]) : [];
  for (const swatch of swatches) {
    const colour = new THREE.Color(swatch.dataset.colour);
    swatch.setAttribute('aria-pressed', String(materials.length > 0 && materials.every(material => material.color?.equals(colour))));
  }
  syncColourPresentation();
}
function selectDoor(door) {
  if (selectedDoor === door) return;
  if (selectedDoor) {
    const edge = selectedDoor.userData.selectionEdge;
    if (edge) {
      edge.material.color.copy(selectedDoor.userData.edgeBeforeSelection.color);
      edge.material.opacity = selectedDoor.userData.edgeBeforeSelection.opacity;
    }
  }
  selectedDoor = door;
  if (selectedDoor) {
    const edge = selectedDoor.userData.selectionEdge;
    if (edge) {
      selectedDoor.userData.edgeBeforeSelection = { color: edge.material.color.clone(), opacity: edge.material.opacity };
      // Emphasise the existing neutral edges without an editor-style coloured outline.
      edge.material.opacity = 0.65;
    }
  }
  updateSelectionUI();
}
function setDoorColor(hex) {
  if (!selectedDoor) return;
  const materials = Array.isArray(selectedDoor.material) ? selectedDoor.material : [selectedDoor.material];
  materials.forEach(material => { if (material.color) material.color.set(hex); });
  updateSelectionUI();
}
swatches.forEach(swatch => swatch.addEventListener('click', () => setDoorColor(swatch.dataset.colour)));


// ======================================================
// LOAD GLB
// ======================================================

const loader =
  new GLTFLoader();


const SCENES = { upper: './upper_cabinets.glb', island: './upper_cabinets_island+.glb' };
const NAMES = { upper: 'Upper Cabinets', island: 'Upper Cabinets + Island' };
const toggle = document.getElementById('island'), status = document.getElementById('status');
let currentType = null, requestId = 0;
function disposeModel(model) {
  const geometries = new Set(), materials = new Set(), textures = new Set(), skeletons = new Set();
  model.traverse(object => {
    if (object.geometry) geometries.add(object.geometry);
    if (object.skeleton) skeletons.add(object.skeleton);
    for (const material of Array.isArray(object.material) ? object.material : [object.material]) {
      if (!material) continue;
      materials.add(material);
      for (const value of Object.values(material)) if (value?.isTexture) textures.add(value);
    }
  });
  geometries.forEach(item => item.dispose()); materials.forEach(item => item.dispose());
  textures.forEach(item => item.dispose()); skeletons.forEach(item => item.dispose());
}
function frameModel(box, firstLoad) {
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(box.getBoundingSphere(new THREE.Sphere()).radius, .001);
  const offset = camera.position.clone().sub(controls.target), oldDistance = offset.length();
  const direction = firstLoad || oldDistance < .00001 ? new THREE.Vector3(.9, -1.4, .6).normalize() : offset.normalize();
  const vertical = THREE.MathUtils.degToRad(camera.fov);
  const horizontal = 2 * Math.atan(Math.tan(vertical / 2) * camera.aspect);
  const fit = radius / Math.sin(Math.min(vertical, horizontal) / 2) * 1.12;
  const distance = firstLoad ? fit : Math.max(oldDistance, fit);
  // Flush residual damping before translating camera and target together.
  controls.enableDamping = false; controls.update();
  controls.target.copy(center); camera.position.copy(center).addScaledVector(direction, distance);
  camera.near = Math.max(radius / 1000, .00001); camera.far = Math.max(radius * 100, distance + radius * 10);
  controls.minDistance = radius * .05; controls.maxDistance = Math.max(radius * 30, distance * 2);
  camera.updateProjectionMatrix(); camera.lookAt(center); controls.update(); controls.enableDamping = true;
}
async function loadScene(type) {
  if (!SCENES[type]) return;
  selectDoor(null);
  const id = ++requestId;
  toggle.checked = type === 'island'; status.classList.remove('error'); status.textContent = 'Loading...';
  document.getElementById('viewer').setAttribute('aria-busy', 'true');
  try {
    const gltf = await loader.loadAsync(SCENES[type]), model = gltf.scene;
    // Ignore and dispose late responses after a newer toggle request.
    if (id !== requestId) { disposeModel(model); return; }
    const box = new THREE.Box3().setFromObject(model);
    if (box.isEmpty() || !Number.isFinite(box.min.length() + box.max.length())) {
      disposeModel(model); throw new Error('Model has no valid bounds');
    }
    prepareModelRendering(model);
    configureLighting(box);
    const firstLoad = !currentModel;
    selectDoor(null);
    // Keep the previous scene usable until its replacement loads successfully.
    if (currentModel) { scene.remove(currentModel); disposeModel(currentModel); }
    currentModel = model; currentType = type; scene.add(currentModel); frameModel(box, firstLoad);
    document.getElementById('scene-name').textContent = NAMES[type]; status.textContent = '';
  } catch (error) {
    console.error('GLB ERROR:', error);
    if (id !== requestId) return;
    toggle.checked = currentType === 'island'; status.classList.add('error'); status.textContent = 'Failed to load model';
  } finally {
    if (id === requestId) document.getElementById('viewer').setAttribute('aria-busy', 'false');
  }
}
toggle.addEventListener('change', () => loadScene(toggle.checked ? 'island' : 'upper'));
loadScene('upper');

// ======================================================
// CLICK / TAP OBJECT (without selecting after an orbit or pinch)
// ======================================================

const activePointers = new Map();
const validTaps = new WeakSet();
renderer.domElement.addEventListener('pointerdown', event => {
  const state = { x: event.clientX, y: event.clientY, moved: false,
    cancelled: event.button !== 0 || !event.isPrimary || document.getElementById('viewer').getAttribute('aria-busy') === 'true',
    model: currentModel };
  activePointers.set(event.pointerId, state);
  if (activePointers.size > 1) activePointers.forEach(pointer => { pointer.cancelled = true; });
}, { capture: true });
window.addEventListener('pointermove', event => {
  const state = activePointers.get(event.pointerId);
  // Track maximum displacement, including a drag that returns to its starting point.
  if (state && Math.hypot(event.clientX - state.x, event.clientY - state.y) >= 5) state.moved = true;
}, { capture: true });
window.addEventListener('pointerup', event => {
  const state = activePointers.get(event.pointerId);
  activePointers.delete(event.pointerId);
  if (state && !state.cancelled && !state.moved && state.model === currentModel &&
      Math.hypot(event.clientX - state.x, event.clientY - state.y) < 5 &&
      document.getElementById('viewer').getAttribute('aria-busy') !== 'true') validTaps.add(event);
}, { capture: true });
window.addEventListener('pointercancel', event => {
  activePointers.delete(event.pointerId);
  activePointers.forEach(pointer => { pointer.cancelled = true; });
}, { capture: true });
window.addEventListener('blur', () => activePointers.clear());

renderer.domElement.addEventListener(
  "pointerup",
  (event) => {

    if (!currentModel || !validTaps.has(event)) return;


    const rect =
      renderer.domElement
        .getBoundingClientRect();


    if (event.clientX < rect.left || event.clientX > rect.right ||
        event.clientY < rect.top || event.clientY > rect.bottom) return;

    mouse.x =
      (
        (
          event.clientX -
          rect.left
        )
        /
        rect.width
      ) * 2 - 1;


    mouse.y =
      -(
        (
          event.clientY -
          rect.top
        )
        /
        rect.height
      ) * 2 + 1;


    // The pointer may finish before the next animation frame after camera motion.
    camera.updateMatrixWorld();
    currentModel.updateMatrixWorld(true);
    raycaster.setFromCamera(
      mouse,
      camera
    );


    const hits =
      raycaster.intersectObject(
        currentModel,
        true
      );


    if (hits.length === 0) {
      selectDoor(null);
      return;
    }


    // Only use the nearest surface: never select a door through a carcass/island.
    selectDoor(resolveDoor(hits[0].object));



  },
  { capture: true }
);


// ======================================================
// WINDOW RESIZE
// ======================================================

function resizeViewer() {
  const viewer = document.getElementById('viewer');
  const width = viewer.clientWidth, height = viewer.clientHeight;
  camera.aspect = width / Math.max(height, 1);
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(width, height);
}
window.addEventListener('resize', resizeViewer);
new ResizeObserver(resizeViewer).observe(document.getElementById('viewer'));
resizeViewer();

// ======================================================
// RENDER LOOP
// ======================================================

function animate() {

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>
